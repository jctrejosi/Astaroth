[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astaroth-core"
version = "0.1.0"
description = "Librería compartida de Astaroth: ingesta del legado Advantage (.ADT), limpieza de datos y bloque RFM."
requires-python = ">=3.11"
dependencies = []

# Estructura plana: este directorio ES el paquete `core`.
# Se usa preferentemente vía PYTHONPATH (añadir `Astaroth/`), por lo que el
# empaquetado pip queda como subpaquete de un monorepo si se necesita.
[tool.setuptools]
packages = ["core", "core.RFM"]
