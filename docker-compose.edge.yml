# Despliegue en el servidor con el EDGE COMPARTIDO (`edge_caddy`).
#
# Uso (junto al compose base):
#   docker compose -f docker-compose.yml -f docker-compose.edge.yml up -d
#
# El compose base publica los puertos en 127.0.0.1 (ASTAROTH_BIND_IP), así que
# nada queda expuesto en el host: el edge alcanza los contenedores por la red
# `shared_edge` y termina TLS en 443. El único puerto público sigue siendo el
# del edge (80/443).
#
# El ruteo por prefijo (/clustering, /xgboost, …) lo hace el Caddyfile del edge.

services:
  astaroth:
    networks:
      - default
      - shared_edge

  load-balancer:
    networks:
      - default
      - shared_edge

networks:
  shared_edge:
    external: true
    name: shared_edge
