# Astaroth — tres servicios independientes (un proceso Python por contenedor).
#
# Cada servicio cabe holgado en plan starter (512 MB): usa ~180 MB.
# Los modelos entrenados viajan en la imagen (saved_models están trackeados).
#
# Cómo desplegar:
#   A) Blueprint: si este repo está conectado a Render como Blueprint, al
#      pushear crea los 3 servicios con estos ajustes (completa los valores
#      de ADMIN_KEY y DATABASE_URL en el dashboard).
#   B) Manual: crea 3 Web Services en Render con cada Dockerfile (abajo) y
#      estos mismos envs/healthCheck.
#
# URLs resultantes (ejemplo): https://astaroth-clustering.onrender.com
#                            https://astaroth-xgboost.onrender.com
#                            https://astaroth-uplift.onrender.com
# Luego, en el backend de mercaldas (Render) apunta:
#   CLUSTERING_API_URL=https://astaroth-clustering.onrender.com
#   XGBOOST_API_URL=https://astaroth-xgboost.onrender.com
#   UPLIFT_API_URL=https://astaroth-uplift.onrender.com

services:
  - type: web
    name: astaroth-clustering
    runtime: docker
    plan: starter
    dockerfilePath: ./clustering-api/Dockerfile
    dockerContext: ./clustering-api
    healthCheckPath: /health
    envVars:
      # Clave compartida para los /admin/* y /segment-clients
      - key: ADMIN_KEY
        sync: false
      # Réplica de analytics (Postgres). Sin esto, los endpoints que leen
      # clientes (RFM/segmentos) devuelven 503.
      - key: DATABASE_URL
        sync: false

  - type: web
    name: astaroth-xgboost
    runtime: docker
    plan: starter
    dockerfilePath: ./XGBoost-api/Dockerfile
    dockerContext: ./XGBoost-api
    healthCheckPath: /health
    envVars:
      - key: ADMIN_KEY
        sync: false

  - type: web
    name: astaroth-uplift
    runtime: docker
    plan: starter
    dockerfilePath: ./uplift-api/Dockerfile
    dockerContext: ./uplift-api
    healthCheckPath: /health
    envVars:
      - key: ADMIN_KEY
        sync: false
